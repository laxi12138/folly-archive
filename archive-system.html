<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Relic Archive · Filing System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="archive-system.css">
</head>
<body>
    <div id="archive-map"></div>

    <div id="archive-crosshair" aria-hidden="true">
        <span class="crosshair-h"></span>
        <span class="crosshair-v"></span>
        <span class="crosshair-core"></span>
    </div>

    <aside class="search-panel" aria-label="Coordinate tools">
        <svg class="panel-outline left-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0.25 .25 H99.75 V76 L66 99.75 H.25 Z"></path>
        </svg>

        <a class="back-link" href="index.html" aria-label="Back to Ruin Atlas">‹</a>
        <h1 data-i18n="panel_title">Relic Archive · Filing System</h1>
        <div id="language-switcher" class="language-switcher" aria-label="Language">
            <button type="button" data-lang="zh">繁</button>
            <span>/</span>
            <button type="button" data-lang="en">EN</button>
            <span>/</span>
            <button type="button" data-lang="ja">JP</button>
        </div>

        <section class="location-tools">
            <div class="tool-line coord-line">
                <div class="coord-inputs">
                    <input id="coord-lat" inputmode="decimal" autocomplete="off" placeholder="Lat">
                    <input id="coord-lng" inputmode="decimal" autocomplete="off" placeholder="Lng">
                </div>
                <button id="locate-coordinate" type="button" data-i18n="mark_location">Mark Location</button>
            </div>
            <div id="search-status" class="micro-status" aria-live="polite"></div>

            <div class="pin-tool" aria-label="Drag a location pin to the map">
                <div class="pin-tool-box">
                    <button id="drag-location-pin" class="drag-location-pin" type="button" aria-label="Drag location marker">
                        <svg viewBox="0 0 32 46" aria-hidden="true">
                            <circle class="pin-sphere-shadow" cx="17" cy="11.5" r="8"></circle>
                            <circle class="pin-sphere" cx="15" cy="9.5" r="8"></circle>
                            <circle class="pin-sphere-highlight" cx="12.5" cy="6.5" r="2.2"></circle>
                            <path class="pin-stem" d="M15 17.5 L15 36"></path>
                            <path class="pin-point" d="M11.5 34 L15 43 L18.5 34 Z"></path>
                        </svg>
                    </button>
                </div>
                <span class="pin-tool-label" data-i18n="drag_pin">Drag Marker</span>
            </div>
        </section>

        <div class="panel-rule"></div>

        <section class="layer-panel">
            <div class="layer-heading" data-i18n="layers_title">Visible Layers</div>
            <label class="layer-row">
                <input id="layer-border" type="checkbox">
                <span class="checkmark"></span>
                <span data-i18n="layer_border">National Borders</span>
            </label>
            <label class="layer-row">
                <input id="layer-satellite" type="checkbox">
                <span class="checkmark"></span>
                <span data-i18n="layer_satellite">Satellite</span>
            </label>
            <label class="layer-row">
                <input id="layer-terrain" type="checkbox" checked>
                <span class="checkmark"></span>
                <span data-i18n="layer_terrain">Terrain Contours</span>
            </label>
            <label class="layer-row">
                <input id="layer-human" type="checkbox" checked>
                <span class="checkmark"></span>
                <span data-i18n="layer_human">Human Settlement Traces</span>
            </label>
            <label class="layer-row">
                <input id="layer-archive" type="checkbox" checked>
                <span class="checkmark"></span>
                <span data-i18n="layer_archive">Archived Relics</span>
            </label>
            <label class="layer-row">
                <input id="layer-visitors" type="checkbox">
                <span class="checkmark"></span>
                <span data-i18n="layer_visitors">Visitor Submissions</span>
            </label>
        </section>
    </aside>

    <button id="form-handle" class="form-handle" type="button" aria-controls="archive-form-shell" aria-expanded="false" title="Open archive form">
        <svg class="form-handle-outline" viewBox="0 0 28 58" preserveAspectRatio="none" aria-hidden="true">
            <path d="M1 9 L27 1 L27 57 L1 49 Z"></path>
        </svg>
        <span class="form-handle-glyph">‹</span>
    </button>
    <button id="new-record" class="new-record" type="button" title="New record">＋</button>

    <main id="archive-form-shell" class="archive-form-shell" aria-hidden="true">
        <svg class="panel-outline form-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M15 .25 H99.75 V99.75 H.25 V28 Z"></path>
        </svg>

        <div class="archive-form-title" data-i18n="form_title">Archive Submission</div>

        <form id="archive-form" novalidate>
            <div class="form-grid-top">
                <input id="archivist" name="archivist" required data-i18n-placeholder="archivist" placeholder="Archivist">
                <input id="archive-coordinate" name="coordinate" required data-i18n-placeholder="coordinate" placeholder="Coordinates">
                <input id="archive-date" name="date" type="date" required aria-label="Date">
            </div>

            <div class="record-body">
                <label class="attachment-box" for="attachments">
                    <input id="attachments" name="attachments" type="file" multiple accept="image/*,audio/*,video/*,.pdf,.txt">
                    <span data-i18n="attachment">Add Attachment</span>
                    <small id="attachment-count">0</small>
                </label>

                <div class="record-fields">
                    <input id="place-title" name="title" required data-i18n-placeholder="place_title" placeholder="Place Title">
                    <textarea id="description" name="description" required data-i18n-placeholder="description" placeholder="Description"></textarea>
                </div>
            </div>

            <div id="file-list" class="file-list"></div>

            <div class="submission-row">
                <div class="admin-box">
                    <input id="admin-password" name="adminPassword" type="password" autocomplete="current-password" placeholder="********">
                    <button id="admin-submit" type="button" data-i18n="admin_archive">Archive</button>
                </div>
                <button id="visitor-submit" class="visitor-submit" type="button" data-i18n="visitor_submit">Visitor Submit</button>
            </div>

            <div id="turnstile-slot"></div>
            <div id="submit-status" class="submit-status" aria-live="polite"></div>
        </form>
    </main>

    <div id="new-record-dialog" class="system-dialog" hidden aria-hidden="true">
        <div class="system-dialog-backdrop"></div>
        <div class="system-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="new-record-dialog-title">
            <div id="new-record-dialog-title" class="system-dialog-title" data-i18n="new_record_confirm_title">New Record</div>
            <p data-i18n="new_record_confirm_body">Clear all unsubmitted content and create a new archive record?</p>
            <div class="system-dialog-actions">
                <button id="new-record-cancel" type="button" data-i18n="cancel">Cancel</button>
                <button id="new-record-confirm" type="button" data-i18n="confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="archive-system.js"></script>
</body>
</html>
