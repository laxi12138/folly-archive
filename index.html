
<!-- index.html -->

<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width,
           initial-scale=1,
           viewport-fit=cover">

    <title>墟域圖 · 遺構館</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link rel="stylesheet" href="style.css?v=2" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>// 配置 worker 路径
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
</head>

<body>
    <!-- 🌟 独立提取：顶部透视切割线 (层级 9) -->
    <!-- 左上 -->
    <svg style="position: fixed; top: 0; left: 0; width: 230px; height: 40px; z-index: 9; pointer-events: none;"><line x1="0" y1="0" x2="230" y2="40" stroke="#000" stroke-width="1" /></svg>
    <!-- 右上 -->
    <svg style="position: fixed; top: 0; right: 0; width: 168px; height: 40px; z-index: 9; pointer-events: none;"><line x1="100%" y1="0" x2="0" y2="40" stroke="#000" stroke-width="1" /></svg>
    <!-- 🌟 独立提取出来的：内部主视窗黑框 (层级 90) -->
    <!-- 定位改为了 fixed，并增加了 pointer-events: none 避免阻挡鼠标交互 -->
    <div id="main-viewport-frame" style="position: fixed; top: 40px; bottom: 59px; left: 230px; right: 168px; border: 1px solid #000; z-index: 9; pointer-events: none;"></div>

    <!-- 几何透视相框层 (层级 900) -->
    <div id="suprematist-frame" style="position: fixed; inset: 0; z-index: 870; pointer-events: none;">
        <!-- 底部不透明白底 (调整左侧 168px，右侧 128px) -->
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; border: 1px solid #000; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(1px); -webkit-backdrop-filter: blur(3px); clip-path: polygon(0 100%, 230px 0, calc(100% - 172px) 0, 100% 100%); pointer-events: auto;"></div>

        <!-- 内部主视窗黑框已被移出到上方 -->
        <!-- 四角透视切割线 -->
        <!-- 左下 -->
        <svg style="position: absolute; bottom: 0; left: 0; width: 230px; height: 60px;"><line x1="0" y1="100%" x2="230" y2="0" stroke="#000" stroke-width="1" /></svg>
        <!-- 右下 -->
        <svg style="position: absolute; bottom: 0; right: 0; width: 168px; height: 60px;"><line x1="100%" y1="100%" x2="0" y2="0" stroke="#000" stroke-width="1" /></svg>

        <!-- 顶部墟域图与坐标 -->
        <div id="top-title">墟域圖</div>

        <!-- 底部梯形上的文字标识 -->
        <!-- 底部梯形上的文字标识 -->
        <div id="bottom-labels">
            <span id="bottom-trigger-ruin" style="pointer-events: auto; cursor: pointer;">廢墟園林系列⁙</span>
                <span id="bottom-center-label">遺構館</span>
                <span>遺構錄系列</span>
            </div>
    </div>
    <!-- 绝对定位的档案堆栈容器 (之前设定的 z-index: 50) -->
    <div id="stack-garden" class="file-stack position-left"></div>
    <div id="stack-record" class="file-stack position-right"></div>

    <!-- attachment viewer -->

    <div id="attachment-viewer" class="attachment-viewer">

        <div class="attachment-viewer-inner">

            <div class="attachment-sheet">

                <div class="attachment-hud">

                    <!-- RESET（最上） -->
                    <div id="reset">⿴</div>
                    <div class="hud-pdf-page" id="pdf-page-hud" style="display: none; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px;">
                        <div id="pdf-prev">△</div>
                        <div id="pdf-page-num" style="font-size: 10px; opacity: 0.6; pointer-events: none;">1/1</div>
                        <div id="pdf-next">▽</div>
                    </div>
                    <!-- SCORE ROTATION HUD -->
                    <div class="score-rotate-hud">

                        <div class="hud-divider"></div>

                        <div class="hud-rotate">

                            <div class="joystick-wrap"
                                 id="joystick-wrap">

                                <div id="joystick">

                                    <div id="joystick-knob"></div>

                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 分隔线（和你缩放区一致） -->
                    <div class="hud-divider"></div>
                    <!-- MOVE -->
                    <div class="hud-move">
                        <div id="move-up">↑</div>

                        <div class="hud-middle">
                            <div id="move-left">←</div>
                            <div id="move-right">→</div>
                        </div>

                        <div id="move-down">↓</div>
                    </div>

                    <!-- 分隔线（和你缩放区一致） -->
                    <div class="hud-divider"></div>

                    <!-- ZOOM -->
                    <div class="hud-zoom">
                        <div id="zoom-in">+</div>
                        <div id="zoom-out">−</div>
                    </div>


                </div>

                <div class="attachment-close">
                    ×
                </div>

                <div class="attachment-meta">

                    <div id="attachment-title"
                         class="attachment-title">
                    </div>

                    <div id="attachment-filename"
                         class="attachment-filename">
                    </div>

                </div>

                <div id="attachment-stage" class="attachment-stage">

                    <div id="score-card-shadow"></div>

                    <div id="media-wrapper" class="media-wrapper"></div>

                    <div id="score-hud-shadow" class="score-hud score-hud-shadow">
                        <div class="score-header">圖形記譜—————————</div>
                        <div class="score-body">
                            <img id="score-shadow-image" src="">
                            <div class="shadow-focus-corners">

                                <span class="corner tl"></span>
                                <span class="corner tr"></span>
                                <span class="corner bl"></span>
                                <span class="corner br"></span>

                            </div>

                        </div>
                    </div>

                    <div id="score-hud" class="score-hud open">

                        <div class="score-header" id="score-toggle">
                            —————————同步指示器
                        </div>

                        <div class="score-body">
                            <img id="score-image" src="" />
                            <div class="focus-corners">

                                <span class="corner tl"></span>
                                <span class="corner tr"></span>
                                <span class="corner bl"></span>
                                <span class="corner br"></span>

                            </div>



                            <div id="score-overlay">
                                <svg id="arc-overlay" class="arc-overlay" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
                                    <g id="arcs-container" style="transform-origin: -17px -52.5px;">
                                        <path transform="translate(-10, -50) rotate(160)" class="score-arc" d="M -7.07,-7.07 A 10,10 0 0,1 7.07,-7.07" vector-effect="non-scaling-stroke" />
                                        <path transform="translate(-15, -55) rotate(-150)" class="score-arc" d="M -14.14,-14.14 A 20,20 0 0,1 14.14,-14.14" vector-effect="non-scaling-stroke" />
                                        <path transform="translate(-10, -55) rotate(160)" class="score-arc" d="M -21.21,-21.21 A 30,30 0 0,1 21.21,-21.21" vector-effect="non-scaling-stroke" />
                                    </g>
                                </svg>
                            </div>
                            <div id="score-playhead"></div>
                            <div id="score-pulse"></div>
                            <div id="score-playhead-2"></div>
                        </div>

                    </div>
                    <!-- custom video control layer -->
                    <div class="video-ui" id="video-ui">
                        <div class="video-progress">
                            <div id="video-progress-bar"></div>
                        </div>
                        <!-- controls + chapters -->
                        <div class="video-stack">

                            <div class="video-chapters"></div>

                            <div class="video-controls">
                                <div id="video-play">▽</div>
                                <div id="video-pause">□</div>
                                <div id="chapter-toggle" class="chapter-toggle">※</div>
                            </div>

                        </div>



                    </div>
                </div>

                <div id="attachment-desc"
                     class="attachment-desc">
                </div>

            </div>
        </div>

    </div>

    <!-- map -->

    <div id="map"></div>
    <div id="compass-overlay" class="compass-overlay hidden">
        <div class="compass-container">
            <div class="compass-ring"></div>

            <div class="compass-asterisk">
                <div class="line" style="--deg: 0deg; --len: 20vmin;"></div>

                <div class="line" style="--deg: 45deg; --len: 32vmin;"></div>

                <div class="line" style="--deg: 90deg; --len: 38vmin;"></div>

                <div class="line" style="--deg: 135deg; --len: 27vmin;"></div>

                <div class="line" style="--deg: 180deg; --len: 29vmin;"></div>

                <div class="line" style="--deg: 225deg; --len: 30vmin;"></div>

                <div class="line" style="--deg: 270deg; --len: 30vmin;"></div>

                <div class="line" style="--deg: 315deg; --len: 16vmin;"></div>
            </div>

            <div class="compass-dial"></div>
            <div id="compass-pointer" class="compass-pointer">
                <div class="compass-arrow">⌃</div>
            </div>
        </div>
    </div>

    </div>

    <!-- ui -->

    <div class="ui">

        <div class="main-title"
             id="main-title">

            廢墟園林系列

        </div>

        <div id="title-hover-zone"></div>

        <div id="title-hover-field"></div>

        <div class="subtitle">
            荒構錄 · 墟域圖
        </div>

    </div>
    <!-- hud -->

    <div class="hud">

        <div class="hud-title">

        </div>

        <div class="coords"
             id="coords">

            經度◓ 緯度◑

        </div>

    </div>
    <div id="record-nav">

        <div id="record-prev"
             class="record-arrow record-arrow-up">



        </div>



        <div id="record-next"
             class="record-arrow record-arrow-down">



        </div>

    </div>
    <!-- drawer -->
    <!-- =========================
         INTRO DRAWER
    ========================= -->

    <div id="intro-drawer"
         class="intro-drawer">

        <div class="intro-header">



        </div>

        <div class="intro-inner">

            <div class="intro-block">

                <div class="intro-title">
                    廢墟園林
                </div>

                <div class="intro-text">

                    <p>
                        廢墟園林系列是一組以地景殘構與後儀式空間的廢墟劇場實踐。
                    </p>

                    <p>
                        作品將圖形記譜、廢墟樂器與建築式遺構中的“如畫美”並置，使廢墟不再只是被觀看的對象，而轉化為可被聆聽的聲學場域。在緩慢失序的空間中，消亡中的造物以噪聲、振動與回響的形式持續顯影。
                    </p>

                    <p>
                        最終，這些影像與聲音被存入「遺構館」，作為一種尚未完成的檔案延續。
                    </p>

                </div>

            </div>



        </div>

    </div>
    <div id="archive-drawer"
         class="drawer">

        <div class="drawer-header">

            <div class="drawer-close" onclick="closeDrawer()">
                ×
            </div>

        </div>
        <div class="drawer-inner">

            <div id="drawer-content">

                <div class="drawer-body">
                    select a site
                </div>

            </div>

        </div>

    </div>

    <!-- mask -->
    <div id="drawer-mask" class="drawer-mask" onclick="closeDrawer()"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="script.js"></script>

</body>
</html>
